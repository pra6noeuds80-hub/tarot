<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.5 "Cormorant Garamond",Georgia,serif;--c1:#14153a;--c2:#d6b46a;--c3:#f1e8d4;--c4:#d6b46a}
body[data-deck=vitrail]{--c1:#12324d;--c2:#e0a030;--c3:#fdf2dc;--c4:#ef6a4c}
body[data-deck=parchemin]{--c1:#f1e4c3;--c2:#6b3b1d;--c3:#2b1d14;--c4:#8c2f2f}

header{text-align:center;padding:1.6rem 1rem .4rem}

.bar{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;align-items:center;padding:.8rem 1rem;max-width:1100px;margin:0 auto}

.table{--w:clamp(54px,9.4vw,104px);position:relative;height:clamp(440px,64vw,660px);border:1px solid var(--line);border-radius:20px;overflow:hidden;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 85% 70%,#fff8,transparent),radial-gradient(1px 1px at 40% 80%,#fff7,transparent),radial-gradient(ellipse at 50% 0,#2b2d6e,#0b0c1e 70%)}
[data-decor=foret] .table{background:radial-gradient(ellipse at 50% 100%,#2a7a58,#08201a 75%)}
[data-decor=pourpre] .table{background:radial-gradient(circle at 50% 40%,#7a2246,#1c0714 80%)}
[data-decor=aube] .table{background:linear-gradient(#f2b27a,#c96f7a 52%,#3b2a5c)}
[data-decor=velours] .table{background:repeating-linear-gradient(45deg,#0f3b3a 0 3px,#124643 3px 6px)}

.slot{position:absolute;transform:translate(-50%,-50%);animation:deal .6s both;animation-delay:calc(var(--i)*90ms)}
@keyframes deal{from{opacity:0;transform:translate(-50%,-90%) scale(.5)}}
.card{position:relative;width:var(--w);aspect-ratio:7/12;perspective:800px;cursor:pointer;transform:rotate(var(--r,0deg))}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:7px;box-shadow:0 6px 16px #0008}
.front{transform:rotateY(180deg);background:var(--c1);color:var(--c3);border:2px solid var(--c2);box-shadow:0 6px 16px #0008,inset 0 0 0 4px var(--c1),inset 0 0 0 5px var(--c2)}
[data-deck=email] .front{box-shadow:0 0 14px #e2bf5f66,inset 0 0 0 4px var(--c1),inset 0 0 0 5px var(--c2)}
.fc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9% 6%;text-align:center}
.fc.rv{transform:rotate(180deg)}
.num{font:400 calc(var(--w)*.15)/1 Marcellus,serif;color:var(--c2)}
.g{font-size:calc(var(--w)*.46);line-height:1;color:var(--c4);font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif}
.g svg{width:calc(var(--w)*.46);height:calc(var(--w)*.46);stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.nm{font:700 calc(var(--w)*.125)/1.1 "Cormorant Garamond",serif}
.back{border:2px solid var(--c2);display:grid;place-items:center;color:var(--c2);font-size:calc(var(--w)*.4)}
.back::after{content:"✦";text-shadow:0 0 8px #000}
[data-back=etoiles] .back{background:radial-gradient(#fff4 1px,transparent 1.5px) 0 0/10px 10px,#1a1b45}
[data-back=soleil] .back{background:repeating-conic-gradient(#2a1c4a 0 10deg,#6a3560 10deg 20deg)}
[data-back=losange] .back{background:repeating-linear-gradient(45deg,#16304a 0 6px,#2a5a7a 6px 7px),#16304a}
[data-back=coquille] .back{background:repeating-radial-gradient(circle at 50% 100%,#3a1d2e 0 6px,#7a3a55 6px 8px)}
[data-back=photo] .back{background:var(--pb) center/cover}
[data-back=photo] .back::after{content:""}
.lab{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:.72rem;line-height:1.05;text-align:center;width:max-content;max-width:calc(var(--w)*1.5);color:#f3e3b8;text-shadow:0 1px 3px #000}
.lab.up{top:auto;bottom:calc(100% + 8px)}
#rd{list-style:none;padding:0;margin:1.2rem 0;display:grid;gap:.6rem}
#rd li{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:.6rem .9rem}

.act{display:flex;gap:.6rem;flex-wrap:wrap}
#hl p{margin:.5rem 0;padding:.5rem .8rem;background:var(--panel);border-radius:8px;white-space:pre-wrap;font-size:.92rem}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:0 1rem 2rem}
.art{width:80%;flex:1;min-height:0;object-fit:cover;border-radius:4px;margin:5% 0;border:1px solid var(--c2)}
#bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:.5rem;margin:.6rem 0}
#bg button{position:relative;padding:0;aspect-ratio:7/10;overflow:hidden;border-radius:8px}
#bg .tag{position:absolute;left:0;right:0;bottom:0;background:#000c;color:#d6b46a;font-size:.68rem;line-height:1.2;padding:3px 0;text-align:center}
#bg img{width:100%;height:100%;object-fit:cover;display:block}
#bg button[aria-pressed=true]{outline:3px solid var(--gold)}
.table.solo{--w:calc(clamp(440px,64vw,660px)*.49)}
.table.solo .lab{font-size:1rem;top:calc(100% + 8px)}
#dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.2rem .8rem;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:.6rem;margin:.4rem 0}
.bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:5px}
.ov{position:relative;z-index:1;color:#fff;text-shadow:0 1px 4px #000,0 0 2px #000}
#bs{color:var(--mute);font-size:.9rem;margin:.3rem 0}
@media (prefers-reduced-motion:reduce){.slot{animation:none}.in{transition:none}}

<script>
const $=s=>document.querySelector(s),B=document.body;
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296*n|0};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const R=["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
const MAJ=[
["Le Mat","♅","Saut dans l’inconnu, liberté, nouveau départ","Imprudence, errance, peur de s’engager","Uranus"],
["Le Bateleur","☿","Initiative, talent, tous les outils sont là","Dispersion, manipulation, projet qui tarde","Mercure"],
["La Papesse","☽","Intuition, secret, savoir intérieur","Silence subi, intuition ignorée","Lune"],
["L’Impératrice","♀","Fécondité, création, abondance","Étouffement, blocage créatif","Vénus"],
["L’Empereur","♈","Structure, autorité, protection","Rigidité, abus de pouvoir","Bélier"],
["Le Pape","♉","Transmission, tradition, guide","Dogme, conformisme","Taureau"],
["L’Amoureux","♊","Choix du cœur, union, alignement","Hésitation, tentation, désaccord","Gémeaux"],
["Le Chariot","♋","Victoire, maîtrise, mouvement","Perte de cap, conflit intérieur","Cancer"],
["La Force","♌","Courage doux, patience, cœur de lion","Doute, énergie qui s’épuise","Lion"],
["L’Ermite","♍","Retrait, sagesse, lumière intérieure","Isolement, repli excessif","Vierge"],
["La Roue de Fortune","♃","Cycle, chance, tournant","Retard, résistance au changement","Jupiter"],
["La Justice","♎","Équilibre, vérité, décision juste","Injustice, mauvaise foi","Balance"],
["Le Pendu","♆","Lâcher-prise, nouveau point de vue","Sacrifice inutile, stagnation","Neptune"],
["L’Arcane sans nom","♏","Fin nécessaire, transformation, renaissance","Refus de tourner la page","Scorpion"],
["La Tempérance","♐","Harmonie, guérison, juste mesure","Excès, déséquilibre","Sagittaire"],
["Le Diable","♑","Attachements, désir, chaînes choisies","Libération, prise de conscience","Capricorne"],
["La Maison-Dieu","♂","Rupture soudaine, vérité qui éclate","Choc évité de justesse, peur du changement","Mars"],
["L’Étoile","♒","Espoir, inspiration, sérénité","Découragement, foi vacillante","Verseau"],
["La Lune","♓","Rêves, illusions, peurs enfouies","Brouillard qui se lève, vérité qui perce","Poissons"],
["Le Soleil","☉","Joie, clarté, réussite","Éclat voilé, enthousiasme tiède","Soleil"],
["Le Jugement","♇","Appel, renaissance, bilan","Doute, appel ignoré","Pluton"],
["Le Monde","♄","Accomplissement, unité, cycle bouclé","Fin retardée, travail inachevé","Saturne"]];
const ic=p=>'<svg viewBox="0 0 24 24">'+p+'</svg>';
const S=[["Bâtons","Feu · Bélier, Lion, Sagittaire","énergie, projets",ic('<path d="M12 3v18M12 8C8 7 7 4 7 3c3 0 5 2 5 5zm0 5c4-1 5-4 5-5-3 0-5 2-5 5z"/>')],
["Coupes","Eau · Cancer, Scorpion, Poissons","cœur, relations",ic('<path d="M6 4h12c0 5-2 8-6 8S6 9 6 4zM12 12v6M8 20h8"/>')],
["Épées","Air · Gémeaux, Balance, Verseau","esprit, vérité",ic('<path d="M12 2v15M8 14h8M12 17v4"/>')],
["Deniers","Terre · Taureau, Vierge, Capricorne","matière, travail",ic('<circle cx="12" cy="12" r="9"/><path d="M12 6l1.8 4.6h4.7l-3.8 2.8 1.5 4.6-4.2-3-4.2 3 1.5-4.6-3.8-2.8h4.7z"/>')]];
const RK=[["As","Commencement, élan pur","Départ manqué, énergie en friche"],["Deux","Choix, dualité, équilibre","Indécision, déséquilibre"],["Trois","Croissance, première réussite","Retard, plans qui s’éparpillent"],["Quatre","Stabilité, pause, fondations","Stagnation, enfermement"],["Cinq","Conflit, défi, friction","Tension qui s’apaise ou s’éternise"],["Six","Harmonie, passage, entraide","Dépendance, retour en arrière"],["Sept","Épreuve, stratégie, persévérance","Doute, abandon, stratégie floue"],["Huit","Mouvement, travail, maîtrise","Précipitation, routine pesante"],["Neuf","Presque au but, autonomie","Fatigue, solitude pesante"],["Dix","Aboutissement, plénitude","Surcharge, fin qui pèse"],["Valet","Message, curiosité, apprentissage","Immaturité, nouvelle qui se fait attendre"],["Cavalier","Quête, élan, action","Impatience, fuite en avant"],["Reine","Maturité intérieure, accueil","Repli, humeur changeante"],["Roi","Autorité, maîtrise, vision","Autoritarisme, maîtrise perdue"]];
const DECK=MAJ.map((m,i)=>({n:m[0],g:m[1]+"\uFE0E",num:R[i],up:m[2],rv:m[3],as:m[4]}));
S.forEach(s=>RK.forEach((r,i)=>DECK.push({n:r[0]+(/^[ÉAEIOU]/.test(s[0])?" d’":" de ")+s[0],g:s[3],num:i<10?(i?i+1:"As"):r[0],up:r[1]+" ("+s[2]+")",rv:r[2],as:s[1]})));
const SG=["Bélier","Taureau","Gémeaux","Cancer","Lion","Vierge","Balance","Scorpion","Sagittaire","Capricorne","Verseau","Poissons"];
const HM=["le soi","les biens","les échanges","les racines","la création","le quotidien","le couple","les mutations","les horizons","la vocation","les amitiés","l’inconscient"];
const MO=["Nouvelle lune","Premier croissant","Premier quartier","Lune gibbeuse croissante","Pleine lune","Lune gibbeuse décroissante","Dernier quartier","Dernier croissant"];
function sunSign(d){const b=[[1,20,10],[2,19,11],[3,21,0],[4,20,1],[5,21,2],[6,21,3],[7,23,4],[8,23,5],[9,23,6],[10,23,7],[11,22,8],[12,22,9]],v=(d.getMonth()+1)*100+d.getDate();let r=9;for(const[m,j,i]of b)if(v>=m*100+j)r=i;return r}
const age=((Date.now()-Date.UTC(2000,0,6,18,14))/864e5%29.530588+29.530588)%29.530588;
$("#sky").textContent="Aujourd’hui : Soleil en "+SG[sunSign(new Date())]+" · "+MO[Math.floor(age/29.530588*8+.5)%8];
["#su","#as"].forEach((s,k)=>{$(s).innerHTML='<option value="-1">'+(k?"Mon ascendant…":"Mon signe solaire…")+'</option>'+SG.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join("")});
function spread(k){const a=+$("#as").value,u=+$("#su").value;
if(k=="jour")return[[50,50,"Votre carte"]];
if(k=="trois")return[[20,50,"Passé"],[50,50,"Présent"],[80,50,"Avenir"]];
if(k=="fer"){const P=[[12,22],[22,50],[35,74],[50,82],[65,74],[78,50],[88,22]];return["Passé","Présent","Influences cachées","Obstacles","Entourage","Conseil","Issue"].map((l,i)=>[...P[i],l])}
if(k=="celt")return[[34,50,"Situation"],[34,50,"Obstacle",90],[34,82,"Fondation"],[12,50,"Passé"],[34,18,"Couronne"],[58,50,"Avenir proche"],[88,84,"Vous"],[88,61,"Entourage"],[88,38,"Espoirs et peurs"],[88,15,"Issue"]];
if(k=="trin")return[[20,50,"Soleil"+(u>=0?" en "+SG[u]:"")+" : identité"],[50,50,"Lune : émotions"],[80,50,"Ascendant"+(a>=0?" "+SG[a]:"")+" : masque"]];
const o=[];for(let i=0;i<12;i++){const t=Math.PI+(i+.5)*Math.PI/6;o.push([Math.round(50+40*Math.cos(t)),Math.round(50-37*Math.sin(t)),"Maison "+R[i+1]+" : "+HM[i]+(a>=0?" ("+SG[(a+i)%12]+")":"")])}
o.push([50,50,"Synthèse"]);return o}
let cur=[];
const BK={imgs:{},map:{},opt:{},decor:"",back:""};
const face=(c,rv)=>{const im=BK.imgs[BK.map[c.n]],o=BK.opt[c.n]||{},h=im&&o.t,r='<div class="fc'+(rv?' rv':'')+'">';
if(im&&o.f)return r+'<img class="bgi" alt="" src="'+im.data+'">'+(h?'':'<span class="num ov">'+c.num+'</span><span></span><span class="nm ov">'+c.n+'</span>')+'</div>';
return r+(h?'':'<span class="num">'+c.num+'</span>')+(im?'<img class="art" alt="" src="'+im.data+'">':'<span class="g">'+c.g+'</span>')+(h?'':'<span class="nm">'+c.n+'</span>')+'</div>'};
const item=o=>o.open?'<b>'+o.l+'</b> : '+o.c.n+(o.rv?" (renversée)":"")+'. '+(o.rv?o.c.rv:o.c.up)+'. <i>'+o.c.as+'</i>':'<b>'+o.l+'</b> : carte cachée, touchez-la pour la révéler';
function paint(){$("#rd").innerHTML=cur.map(o=>'<li>'+item(o)+'</li>').join("")}
function draw(){const P=spread($("#sp").value),d=shuf(DECK),use=$("#rv").checked;
cur=P.map((p,i)=>({c:d[i],rv:use&&rnd(100)<35,l:p[2],open:false}));
$("#tb").classList.toggle("solo",P.length==1);$("#tb").innerHTML=P.map((p,i)=>{const o=cur[i],r=p[3]||0;return'<div class="slot" style="left:'+p[0]+'%;top:'+p[1]+'%;--i:'+i+';z-index:'+(r?3:1)+'"><div class="card" data-i="'+i+'" style="--r:'+r+'deg" tabindex="0" role="button" aria-label="'+p[2]+' : retourner la carte"><div class="in"><div class="face back"></div><div class="face front">'+face(o.c,o.rv)+'</div></div></div><span class="lab'+(r?' up':'')+'">'+p[2]+'</span></div>'}).join("");paint()}
const txt=()=>new Date().toLocaleDateString("fr-FR")+" · "+$("#sp").selectedOptions[0].text+"\n"+cur.map(o=>o.l+" : "+o.c.n+(o.rv?" (renversée)":"")+" · "+(o.rv?o.c.rv:o.c.up)).join("\n");
function flip(i){const o=cur[i];if(!o)return;o.open=!o.open;$("#tb").querySelectorAll(".card")[i].classList.toggle("open",o.open);paint();if(cur.every(x=>x.open))save()}
